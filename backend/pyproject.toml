[project]
name = "investrag-studio"
version = "0.1.0"
description = "Local-first multi-format document intelligence and RAG evaluation platform"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "chromadb>=1.0.20",
    "defusedxml>=0.7.1",
    "extract-msg==0.56.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.26.4",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "python-multipart>=0.0.20",
    "pymilvus>=2.6.0",
    # pymilvus's own "milvus_lite" extra excludes win32 in its own package metadata
    # (a stale marker from when milvus-lite genuinely lacked a Windows wheel).
    # milvus-lite 3.2.1 has one and was verified working end-to-end on this machine
    # 2026-08-30 (client, collection, upsert, search) - depend on it directly rather
    # than through the extra that would silently skip it on Windows.
    "milvus-lite>=3.2.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "qdrant-client>=1.15.0",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.4",
]

# Optional extras (design §19 resource profiles). Kept out of the default install so a laptop
# checkout stays light; `uv sync --all-extras` pulls everything the completion plan needs.
# Never let an extra's absence look like a working feature — every capability gated behind one
# of these must report itself unavailable (or fail a test) rather than silently no-op.
[project.optional-dependencies]
parsers = [
    "docling>=2.0.0",
    "pymupdf4llm>=0.0.17",
    "pytesseract>=0.3.13",
]
rerank = [
    "onnxruntime>=1.20.0",
]
eval = [
    "ir-measures>=0.3.6",
    "ragas>=0.2.0",
]
stores = [
    "weaviate-client>=4.9.0",
    "pinecone>=5.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# design §20 last paragraph: "Continuous tests do not require network access, a GPU, or
# every database." The default invocation therefore *deselects* the integration marker;
# `uv run pytest -m integration` opts back in. The CLI `-m` overrides this one.
addopts = "-q -m 'not integration'"
markers = [
    "integration: requires a live vector-database or Postgres service (design §20). Deselected by default; run with `pytest -m integration`. Heavy service-backed stores are ordered to run one at a time - never run this marker under pytest-xdist.",
    "security: adversarial input coverage for design §18's trust boundary (prompt injection, malformed files, archive abuse). Offline and network-free, so it stays in the default run.",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
mypy_path = "src"
packages = ["investrag"]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["uv_build>=0.11.20,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "investrag"
