name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 'hash' is the deterministic offline embedding fallback; it is reported as a
  # fallback everywhere it is used and never stands in for BGE-M3 in a real run.
  INVESTRAG_EMBEDDING_MODE: hash

jobs:
  backend:
    name: backend (ruff / mypy --strict / pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --locked --python 3.12

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type-check (mypy --strict)
        run: uv run mypy src

      # pyproject's own addopts deselect the markers that need network or a
      # live service, so this is the same command a contributor runs locally.
      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: frontend (lint / vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npm run test

      - name: Build (tsc -b && vite build)
        run: npm run build
